# 兼容性实验室（integrations/compat）：用社区真实在用的 SDK 与框架去打一个隔离的网关，并回放各聊天客户端
# 的请求形状。网关在 127.0.0.1 随机端口、临时数据目录里运行，只发布离线示例智能体与确定性夹具模型，
# 不调用任何模型服务。第三方包没有锁死到补丁版本（requirements.txt 只设上限），所以每周跑一次，
# 它们更新后出现的不兼容能及时发现；矩阵作为产物上传，并写进作业摘要。
name: Compat

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  lab:
    name: compatibility lab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci --omit=optional --ignore-scripts
      # 实验室自己的 Node 依赖（锁文件 integrations/compat/package-lock.json），不是网关的依赖。
      - run: npm ci --ignore-scripts --prefix integrations/compat
      # Python 依赖装进虚拟环境（requirements.txt 带版本上限）；run.mjs 会自动用 integrations/compat/.venv。
      - run: python -m venv integrations/compat/.venv
      - run: integrations/compat/.venv/bin/python -m pip install --disable-pip-version-check -r integrations/compat/requirements.txt
      - run: npm run compat -- --out compat-out --strict
      - name: Write the matrix into the job summary
        if: always()
        run: |
          if [ -f compat-out/matrix.md ]; then cat compat-out/matrix.md >> "$GITHUB_STEP_SUMMARY"; else echo "The lab produced no matrix." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compat-matrix
          path: compat-out/
          if-no-files-found: warn

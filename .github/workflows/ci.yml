name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24']
        include:
          # Node 26 只收集结果：package.json 的 engines 仍是 >=24.18.0 <25，是否放宽等这里的结果再定。
          - os: ubuntu-latest
            node: '26'
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && npm --version
      - run: npm ci --omit=optional --ignore-scripts
      - run: npm run verify

  # Windows：测试里大量用到 POSIX 专用写法（chmod 出来的带 shebang 的假可执行文件、/bin/sh、
  # 权限位、SIGTERM/SIGKILL 等），完整测试在 Windows 上必然失败。这里先跑类型检查、格式检查与
  # 和 Windows 打包相关的测试；完整的 Windows 兼容是另一项工作（清单见 docs/releasing.md）。
  windows:
    name: check (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # git 在 Windows 上默认把换行转成 CRLF，prettier --check 会因此报错。
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --omit=optional --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: node --import ./dist/test/setup-locale.js --test --test-concurrency=1 dist/test/release-plan.test.js dist/test/claude-sdk.test.js

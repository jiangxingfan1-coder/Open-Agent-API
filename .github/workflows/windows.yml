name: Windows

# The full test suite on windows-latest (see docs/windows.md). Tests that only make sense on POSIX
# are skipped inside the test files with a stated reason.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: full tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # Keep LF line endings so fixtures and prettier see the same bytes as on POSIX.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --omit=optional --ignore-scripts
      - run: npm run build
      - run: node scripts/test-offline.mjs --all
